name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install Tesseract and language packs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-ara
          tesseract --version | head -1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest
