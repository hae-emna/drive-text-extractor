name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install Tesseract and language packs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-ara
          tesseract --version | head -1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type-check
        run: uv run mypy

      - name: Cache the RapidOCR models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ocr-models
          key: ocr-models-${{ hashFiles('backend/src/drive_text_extractor/ocr/rapid_models.py') }}

      - name: Test
        run: uv run pytest
        env:
          OCR_MODELS_DIR: ${{ runner.temp }}/ocr-models

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker · build and end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built here rather than by compose to use the GitHub Actions layer cache; the tags are the
      # image names in docker-compose.yml, so compose runs exactly these images.
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          tags: drive-text-extractor-api
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: runtime
          tags: drive-text-extractor-web
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start both containers in demo mode
        run: docker compose up --no-build --wait
        env:
          FILE_SOURCE: local

      # Goes through nginx, so it checks the /api forwarding as well as the API.
      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
