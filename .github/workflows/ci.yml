name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install Tesseract and language packs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-ara
          tesseract --version | head -1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker · build and end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          tags: drive-text-extractor:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the app in demo mode
        run: docker run -d --name app -p 8000:8000 -e FILE_SOURCE=local drive-text-extractor:ci

      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8000

      - name: Show logs on failure
        if: failure()
        run: docker logs app
