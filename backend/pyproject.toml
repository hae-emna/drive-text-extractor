[project]
name = "drive-text-extractor"
version = "0.1.0"
description = "Extract text from the PDFs and images of a public Google Drive folder."
authors = [{ name = "Emna Najai" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["drive_text_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ocr: needs the Tesseract binary and language packs installed",
]
